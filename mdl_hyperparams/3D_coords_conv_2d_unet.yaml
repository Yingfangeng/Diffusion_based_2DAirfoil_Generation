dataset_csv_path: 'dataset/New_compressor_geometry/1D_compressor_geometry_filtered.csv'
data_structure: '3D_coordinates' 
neural_network_sturcture: 'ResNet_UNet_2D'
learning_rate: 1E-4
num_epochs: 300
batch_size: 32
model_channel: 64  # the number of channels for of first layer
model_layer: 5      # number of layers under the same dimension
model_channel_multiplication: [1,2,4, 8] # dimension multiplication factor
train_val_division: 0.8 # training set percent
cond_scale: 1    # CFG guidance scale
rescaled_phi: 0  # Mixing ratio of the std_function
device: 'cuda'
component_number: 16896
number_of_profiles: 16
number_of_points: 512
restart: False
reduced_data_fraction: 1
curve_file_path: dataset/New_compressor_geometry/3D_geometry_polar_normalised